name: RiskLens Platform CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Run Automated Test Matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Production & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Full Automated Test Suite (142 Tests)
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

  docker-build:
    name: Build & Verify Production Container Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: risklens:ci

      - name: Verify Container Liveness & Health Probe
        run: |
          docker run -d --name risklens-ci -p 8000:8000 risklens:ci
          echo "Waiting for RiskLens container to boot and pass health probe..."
          SUCCESS=0
          for i in {1..30}; do
            if curl -s -f http://127.0.0.1:8000/api/health; then
              echo ""
              echo ">>> Container is healthy and responding!"
              SUCCESS=1
              break
            fi
            echo "Waiting for container startup... ($i/30)"
            sleep 2
          done
          docker logs risklens-ci
          if [ $SUCCESS -ne 1 ]; then
            echo "Container health check timed out after 60 seconds."
            exit 1
          fi
          docker stop risklens-ci
          docker rm risklens-ci
