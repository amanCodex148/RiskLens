name: RiskLens Platform CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Run Automated Test Matrix
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: risklens
          POSTGRES_USER: risklens
          POSTGRES_PASSWORD: risklens_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Production & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Full Automated Test Suite (154 Tests)
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql://risklens:risklens_password@localhost:5432/risklens
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: risklens
          POSTGRES_USER: risklens
          POSTGRES_PASSWORD: risklens_password
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

  docker-build:
    name: Build & Verify Production Container Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Build & Verify Production Compose Stack
        run: |
          docker compose up -d --build
          echo "Waiting for RiskLens container to boot and pass health probe..."
          SUCCESS=0
          for i in {1..30}; do
            if curl -s -f http://127.0.0.1:8000/api/health; then
              echo ""
              echo ">>> Container is healthy and responding!"
              SUCCESS=1
              break
            fi
            echo "Waiting for container startup... ($i/30)"
            sleep 2
          done
          docker compose logs
          if [ $SUCCESS -ne 1 ]; then
            echo "Container health check timed out after 60 seconds."
            exit 1
          fi
          docker compose down -v
